<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected Component Flood Fill Visualizer</title>
    <style>
         :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --cell-bg: #0f172a;
            --border-color: #334155;
            --scanner-color: #38bdf8;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
        }
        /* Controls Zone */
        
        .controls-zone {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        
        select,
        button,
        input {
            background: #334155;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        
        button.btn-primary {
            background: #2563eb;
            border-color: #3b82f6;
            font-weight: bold;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* Side-by-Side Main Display */
        
        .display-zone {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
        }
        
        .matrix-card,
        .zones-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }
        
        .card-header {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-bottom: 12px;
        }
        /* Grid Styling */
        
        .grid-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            overflow-x: auto;
        }
        
        table.grid-table {
            border-collapse: collapse;
            user-select: none;
        }
        
        table.grid-table td {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border-color);
            text-align: center;
            font-size: 0.8rem;
            font-weight: bold;
            background-color: var(--cell-bg);
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        /* Scanner line glow */
        
        td.scanning {
            outline: 2px solid var(--scanner-color);
            box-shadow: 0 0 10px var(--scanner-color);
            z-index: 5;
        }
        /* Active flood filling cell */
        
        td.infecting {
            transform: scale(1.15);
            z-index: 10;
            box-shadow: 0 0 8px #ffffff;
        }
        /* Zones Table Panel */
        
        .zones-table-wrapper {
            max-height: 340px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        
        table.zones-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }
        
        table.zones-table th,
        table.zones-table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
        }
        
        table.zones-table th {
            background: #0f172a;
            position: sticky;
            top: 0;
            color: #94a3b8;
        }
        
        .color-badge {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 6px;
        }
        /* Bottom Results Zone */
        
        .results-zone {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        
        .log-box {
            font-family: monospace;
            font-size: 0.85rem;
            background: #090d16;
            padding: 10px;
            border-radius: 4px;
            height: 80px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }
        
        .metrics-container {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .metric-card {
            flex: 1;
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        
        .metric-card .val {
            font-size: 1.4rem;
            font-weight: bold;
            color: #38bdf8;
        }
        
        .metric-card .lbl {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 2px;
        }
    </style>
</head>

<body>

    <div class="app-container">
        <!-- Controls & Options Zone -->
        <div class="controls-zone">
            <div class="control-group">
                <label for="directions">Connect Strategy:</label>
                <select id="directions">
                    <option value="8">8-Way (Inc. Diagonals)</option>
                    <option value="4">4-Way (Orthogonal)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="density">Fill Coverage:</label>
                <select id="density">
                    <option value="0.5">50% Coverage</option>
                    <option value="0.3">30% Coverage</option>
                    <option value="0.7">70% Coverage</option>
                </select>
            </div>

            <div class="control-group">
                <label for="gridSize">Grid Size:</label>
                <input type="number" id="gridSize" value="8" min="4" max="15" style="width: 50px;">
            </div>

            <div class="control-group">
                <label for="speed">Delay:</label>
                <input type="range" id="speed" min="20" max="500" value="150" step="10" style="width: 80px;">
            </div>

            <div class="control-group">
                <button id="btnStart" class="btn-primary">Start Waves</button>
                <button id="btnPause" disabled>Pause</button>
                <button id="btnReset">Reset</button>
            </div>
        </div>

        <!-- Side-by-Side Display Zone -->
        <div class="display-zone">
            <!-- Left Panel: Grid Matrix -->
            <div class="matrix-card">
                <div class="card-header">Matrix Board</div>
                <div class="grid-wrapper">
                    <table class="grid-table" id="gridTable"></table>
                </div>
            </div>

            <!-- Right Panel: Zone / Connected Components Summary -->
            <div class="zones-card">
                <div class="card-header">Discovered Zones</div>
                <div class="zones-table-wrapper">
                    <table class="zones-table">
                        <thead>
                            <tr>
                                <th>Zone ID</th>
                                <th>Start Cell</th>
                                <th>Total Cells</th>
                            </tr>
                        </thead>
                        <tbody id="zonesTableBody">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Results & Live Logs Area -->
        <div class="results-zone">
            <div>
                <div class="card-header">Status Log</div>
                <div class="log-box" id="statusLog">Ready to search...</div>
            </div>

            <div style="display:flex; flex-direction:column; justify-content:center;">
                <div class="card-header">Execution Metrics</div>
                <div class="metrics-container">
                    <div class="metric-card">
                        <div class="val" id="metricTotalZones">0</div>
                        <div class="lbl">Zones Discovered</div>
                    </div>
                    <div class="metric-card">
                        <div class="val" id="metricMaxConnected">0</div>
                        <div class="lbl">Max Connected Cells</div>
                    </div>
                    <div class="metric-card">
                        <div class="val" id="metricVisitedCells">0</div>
                        <div class="lbl">Infected Cells</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State variables
        let map = [];
        let rows = 8;
        let cols = 8;
        let isRunning = false;
        let isPaused = false;
        let delayMs = 150;

        let zoneList = []; // Tracks components: { id, startR, startC, count, color }
        let totalVisitedCount = 0;
        let maxComponentSize = 0;

        // Visual Colors for infection spreading
        const ZONE_COLORS = [
            '#ef4444', '#f97316', '#f59e0b', '#10b981',
            '#06b6d4', '#6366f1', '#a855f7', '#ec4899',
            '#84cc16', '#14b8a6', '#8b5cf6', '#d946ef'
        ];

        // Direction sets matching your Java code
        const DIR4 = [
            [-1, 0],
            [1, 0],
            [0, -1],
            [0, 1]
        ];
        const DIR8 = [
            [-1, 0],
            [1, 0],
            [0, -1],
            [0, 1], // Up, Down, Left, Right
            [-1, -1],
            [-1, 1],
            [1, 1],
            [1, -1] // Diagonal Up-Left, Up-Right, Down-Right, Down-Left
        ];

        // DOM Handles
        const gridTable = document.getElementById('gridTable');
        const zonesTableBody = document.getElementById('zonesTableBody');
        const statusLog = document.getElementById('statusLog');

        const metricTotalZones = document.getElementById('metricTotalZones');
        const metricMaxConnected = document.getElementById('metricMaxConnected');
        const metricVisitedCells = document.getElementById('metricVisitedCells');

        const btnStart = document.getElementById('btnStart');
        const btnPause = document.getElementById('btnPause');
        const btnReset = document.getElementById('btnReset');

        function log(msg) {
            statusLog.innerHTML += `> ${msg}<br>`;
            statusLog.scrollTop = statusLog.scrollHeight;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function checkPause() {
            while (isPaused) {
                await sleep(100);
            }
        }

        // Helper equivalent to Java's find(a,b) check
        function find(a, b) {
            return a >= 0 && a < rows && b >= 0 && b < cols && map[a][b] > 0;
        }

        function generateMatrix() {
            const coverage = parseFloat(document.getElementById('density').value);
            map = [];
            for (let i = 0; i < rows; i++) {
                let row = [];
                for (let j = 0; j < cols; j++) {
                    // Populate cells with positive values (targets) based on coverage density
                    row.push(Math.random() < coverage ? Math.floor(Math.random() * 9) + 1 : 0);
                }
                map.push(row);
            }
        }

        function renderGrid() {
            gridTable.innerHTML = '';
            for (let i = 0; i < rows; i++) {
                let tr = document.createElement('tr');
                for (let j = 0; j < cols; j++) {
                    let td = document.createElement('td');
                    td.id = `cell-${i}-${j}`;
                    td.innerText = map[i][j] > 0 ? map[i][j] : '';
                    if (map[i][j] === 0) {
                        td.style.backgroundColor = '#1e293b';
                    }
                    tr.appendChild(td);
                }
                gridTable.appendChild(tr);
            }
        }

        function getCell(r, c) {
            return document.getElementById(`cell-${r}-${c}`);
        }

        // Adapted from Java `findMaxConnnected` (Recursive Flood Fill)
        async function runInfectionSpread(r, c, zoneObj, directions) {
            if (!isRunning) return;
            await checkPause();

            // Mark cell visited in data (-1) matching Java logic
            map[r][c] = -1;
            zoneObj.count++;
            totalVisitedCount++;

            // Update UI metrics
            metricVisitedCells.innerText = totalVisitedCount;
            if (zoneObj.count > maxComponentSize) {
                maxComponentSize = zoneObj.count;
                metricMaxConnected.innerText = maxComponentSize;
            }

            // Update live row in the zones table
            const countTd = document.getElementById(`zone-count-${zoneObj.id}`);
            if (countTd) countTd.innerText = zoneObj.count;

            // Animate cell visual
            const cellEl = getCell(r, c);
            cellEl.style.backgroundColor = zoneObj.color;
            cellEl.style.color = '#ffffff';
            cellEl.classList.add('infecting');
            await sleep(delayMs);
            cellEl.classList.remove('infecting');

            // Recurse into valid neighboring cells
            for (let [dr, dc] of directions) {
                let nr = r + dr;
                let nc = c + dc;
                if (find(nr, nc)) {
                    await runInfectionSpread(nr, nc, zoneObj, directions);
                }
            }
        }

        // Dual Wave Search Loop (Adapted from Java `findConnected` / `checkOncePerRow`)
        async function startDualWaveProcess() {
            const use8Dir = document.getElementById('directions').value === '8';
            const directions = use8Dir ? DIR8 : DIR4;

            let zoneIdCounter = 0;

            log("Searching Wave initiated...");

            // Searching Wave: Scans row by row across matrix
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    if (!isRunning) return;
                    await checkPause();

                    const cellEl = getCell(i, j);
                    cellEl.classList.add('scanning');
                    await sleep(delayMs / 2);
                    cellEl.classList.remove('scanning');

                    // If searching wave hits an unvisited component start point
                    if (find(i, j)) {
                        zoneIdCounter++;
                        const color = ZONE_COLORS[(zoneIdCounter - 1) % ZONE_COLORS.length];

                        log(`Target found at [${i},${j}]! Handing torch to Infection Wave...`);

                        const zoneObj = {
                            id: zoneIdCounter,
                            startR: i,
                            startC: j,
                            count: 0,
                            color: color
                        };
                        zoneList.push(zoneObj);

                        // Append new zone to side table
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><span class="color-badge" style="background:${color}"></span>Zone #${zoneObj.id}</td>
                            <td>[${i}, ${j}]</td>
                            <td id="zone-count-${zoneObj.id}">0</td>
                        `;
                        zonesTableBody.appendChild(tr);
                        metricTotalZones.innerText = zoneIdCounter;

                        // Trigger Infection Spreading Wave
                        await runInfectionSpread(i, j, zoneObj, directions);

                        log(`Infection wave finished Zone #${zoneObj.id} (${zoneObj.count} cells). Resuming search line.`);
                    }
                }
            }

            log(`Searching completed. Found ${zoneIdCounter} connected components!`);
            isRunning = false;
            btnStart.disabled = false;
            btnPause.disabled = true;
        }

        function init() {
            rows = parseInt(document.getElementById('gridSize').value) || 8;
            cols = rows;
            isRunning = false;
            isPaused = false;
            totalVisitedCount = 0;
            maxComponentSize = 0;
            zoneList = [];

            btnStart.disabled = false;
            btnPause.disabled = true;
            btnPause.innerText = 'Pause';

            metricTotalZones.innerText = '0';
            metricMaxConnected.innerText = '0';
            metricVisitedCells.innerText = '0';
            zonesTableBody.innerHTML = '';
            statusLog.innerHTML = 'Ready...';

            generateMatrix();
            renderGrid();
        }

        // Controls setup
        btnStart.addEventListener('click', () => {
            if (isRunning) return;
            isRunning = true;
            isPaused = false;
            btnStart.disabled = true;
            btnPause.disabled = false;
            startDualWaveProcess();
        });

        btnPause.addEventListener('click', () => {
            isPaused = !isPaused;
            btnPause.innerText = isPaused ? 'Resume' : 'Pause';
            log(isPaused ? 'Animation paused.' : 'Animation resumed.');
        });

        btnReset.addEventListener('click', init);

        document.getElementById('speed').addEventListener('input', (e) => {
            delayMs = parseInt(e.target.value);
        });

        document.getElementById('gridSize').addEventListener('change', init);
        document.getElementById('density').addEventListener('change', init);

        // Initial launch
        init();
    </script>
</body>

</html>
