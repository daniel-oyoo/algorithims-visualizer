<!DOCTYPE html>
<html>

<head>
    <!--

        <a rel="text/javascript" href="script.js">

            if found change colour to yeloow and beggin ciomputing list

            do this back and forth till no sol or board solved 
            -->
    <style>
        body {
            alink: blue;
            vlink: red;
            padding: 15px;
        }
        
        .app-container {
            padding: 10px
        }
        
        .description {
            width: 800px;
            height: 150px;
        }
        
        .controls-options {}
        
        .options-card {
            width: 800px;
            height: 80px;
            background-color: whitesmoke;
        }
        
        .controls-card {
            width: 800px;
            height: 80px;
        }
        
        .main-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            display: flex;
            /*flex-direction: column;*/
        }
        
        .content-card {
            width: 500px;
            height: 500px;
        }
        
        #matrix {}
        
        #progress {
            overflow-y: auto;
            /*fixed overflowing down*/
        }
        /*table
        not necesassirly tue;*/
        
        #status {
            position: sticky;
            top: 0;
        }
        
        .results {
            /*display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;*/
        }
        
        .results-card {
            width: 100px;
            height: 100px;
            border: 2px solid grey;
        }
        /*traversal and animations related quicks*/
        
        .cell {
            width: 40px;
            height: 40px;
            text-align: center;
            border: 2px solid grey;
            border-radius: 5px;
        }
        
        .scan {
            box-shadow: blue 3px 3px 6px 2px, blue -3px -3px 6px 2px;
        }
        
        .empty-cell {
            /*background-color: yellow;*/
            background-color: rgb(255, 0, 0);
        }
        /*
        table data and all
        */
    </style>
</head>

<body>

    <div class="app-conatiner">
        <!-- description of algo-->
        <div class="description">
            <h1>Sodoku visualizer</h1>
            <p>This shows a simple non-mrv visualization of sodoku solver<br/>it may take time on evil sodoku</p>
        </div>

        <!--controls and options cards as class ,uniwue as id-->
        <div class="controls-options">
            <!-- options-->
            <div class="options-card" id="options">
                <label>Algorithim/Startegy <input type="text" value="NON-MRV" disabled="true"></input></label>
                <label>Size <input type="text" value="9 x 9" disabled="true"></input></label>
                <label>Desnsity/Probability <input type="text" value="50 %" disabled="true"></input></label>
                <label>Speed <input type="range" min="10" max="80" value="50"></input></label>
            </div>
            <!-- controls-->
            <div class="controls-card" id="controls">
                <button onclick="renderMatrixDynamically()">Generate</button>
                <button onclick="sodoku()">Solve</button>
                <button onclick="pause()">pause/resume</button>
                <button onclick="reset()">reset</button>
            </div>
        </div>

        <!--main content cards as class ,uniwue as id-->
        <div class="main-content">
            <!-- matrix-->
            <p>Matrix</p>
            <div class="content-card" id="matrix"></div>
            <!-- progress/status-->
            <p>List status</p>
            <div class="content-card" id="progress" scroll="true">
                <!-- table headers and table structure<p>Progress</p>-->
                <table id="status" border="0">
                    <caption>Progress</caption>
                    <tr class="headerRow">
                        <th class="thead">Cell co-ordinate(x,y)</th>
                        <th class="thead">List of usable numbers</th>
                    </tr>
                </table>
            </div>
        </div>

        <div class="result-container">
            <!--results cards as class ,uniwue as id-->
            <div class="results">
                <!-- logs-->
                <p>logs</p>
                <div class="results-card" id="logs">
                </div>
                <!-- empty cells-->
                <p>Empty</p>
                <div class="results-card" id="empty"></div>
                <!-- solved cells-->
                <p>Solved</p>
                <div class="results-card" id="solved"></div>
                <!-- current cell cells-->
                <p>Current<br>Cell</p>
                <div class="results-card" id="current-cell"></div>
                <!-- Partial boards solved-->
                <p>Partial boards</p>
                <div class="results-card " id="p-boards"></div>
            </div>
        </div>



    </div>

    <script type="text/javascript " src="script.js">
    </script>
</body>

</html>
