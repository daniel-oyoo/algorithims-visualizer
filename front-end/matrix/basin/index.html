<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet/css" href="\basinstyle.css" type="text/css">
</head>

<body>

    <div class="app-conatiner">
        <!-- description of algo-->
        <div class="description">
            <h1>---</h1>
            <p>This shows a simple non-mrv visualization of sodoku solver<br/>it may take time on evil sodoku</p>
        </div>

        <!--controls and options cards as class ,uniwue as id-->
        <div class="controls-options">
            <!-- options-->
            <div class="options-card" id="options">
                <label>Algorithim/Startegy <input type="text" value="NON-MRV" disabled="true"></input></label>
                <label>Size <input type="text" value="9 x 9" disabled="true"></input></label>
                <label>Desnsity/Probability <input type="text" value="50 %" disabled="true"></input></label>
                <label>Speed <input type="range" min="10" max="80" value="50"></input></label>
            </div>
        </div>


    </div>
    <br> </br>
    <!-- controls-->
    <div class="controls-card" id="controls">
        <button onclick="renderMatrix()">Generate</button>
        <button onclick="findBasin()">Solve</button>
        <button onclick="pause()">pause/resume</button>
        <button onclick="reset()">reset</button>

        <br> </br>
        <label>Yellow : Not a basin</label><br> </br>
        <label>Green : A basin</label><br> </br>
    </div>
    </div>

    <br> </br>
    <!--main content cards as class ,uniwue as id-->
    <div class="main-content">
        <!-- matrix-->
        <p>Matrix</p>
        <div class="content-card" id="matrix"></div>
        <!-- progress/status-->
        <p>Compare Zone</p>
        <div class="content-card" id="progress" scroll="true">
            <!-- table headers and table structure<p>Progress</p>-->
            <table id="status" border="0">
                <div id="comparison-space"></div>
            </table>
        </div>
    </div>

    <div class="result-container">
        <!--results cards as class ,uniwue as id-->
        <div class="results">
            <!-- logs-->
            <p>logs</p>
            <div class="results-card" id="logs">
            </div>
            <!-- empty cells-->
            <p>Empty</p>
            <div class="results-card" id="empty"></div>
            <!-- solved cells-->
            <p>Solved</p>
            <div class="results-card" id="solved"></div>
            <!-- current cell cells-->
            <p>Current<br>Cell</p>
            <div class="results-card" id="current-cell"></div>
            <!-- Partial boards solved-->
            <p>Partial boards</p>
            <div class="results-card " id="p-boards"></div>
        </div>
    </div>



    </div>

    <script type="text/javascript" src="script.js">
        /*
                                                                                                                                                                                                                                                                                                                                                                                                                   compare only to valid neighbours

                                                                                                                                                                                                                                                                                                                                                                                                                   1. inefficient ---scan everything even afte rfinding basin

                                                                                                                                                                                                                                                                                                                                                                                                                   2. efficient ---if we find basin we know the next  four cells surely cant be basins so we just skip over them

                                                                                                                                                                                                                                                                                                                                                                                                                   we hava a scan light and a line that marks basins 
                                                                                                                                                                                                                                                                                                                                                ofcourse it goes wihtout saying this does us no benefit when ther is actsully no basin
                                                                                                                                                                                                                                                                                                                                                                                                                   both versions are under startegy
                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                */
    </script>
</body>

</html>
