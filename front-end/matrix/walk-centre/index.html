        //build grid
        function buildGrid(row = 5, col = 5) {
            for (let i = 0; i < row; i++) {
                grid.push([])
                for (let j = 0; j < col; j++) {
                    grid[i][j] = Math.floor(Math.random() * 10);
                }
            }
        }


        function findMax(i, j) {
            let max = 2000000;
            let a = -2;
            let b = -2;

            if (i < grid.length - 1 && i > 0 && j > 0 && j < grid[i].length - 1) {
                //check up
                if (grid[i - 1][j] != -1 && grid[i - 1][j] > max) {
                    max = grid[i - 1][j];
                    a = i - 1;
                    b = j;
                }

                //check right
                if (grid[i][j + 1] != -1 && grid[i][j + 1] > max) {
                    max = grid[i][j + 1];
                    a = i;
                    b = j + 1;
                }

                //check down
                if (
                    grid[i + 1][j] > max) {
                    max = grid[i + 1][j];
                    a = i + 1;
                    b = j;
                }

                //check left
                if ( //map[i][j-1]!=-1&&
                    grid[i][j - 1] > max) {
                    max = grid[i][j - 1];
                    a = i;
                    b = j - 1;
                }

                                if (a == -1 && b == -1) {
                                    max = 0;
                                    a = i + 1;
                                    b = j + 1;
                                }*/
            }

            return [a, b, max];

        }
